name: Finance data recovery (PITR)

# Se dispara al pushear el archivo tools/finance-recovery/MODE, cuyo contenido
# ("diagnose" o "restore") define qué hace la corrida.
on:
  push:
    branches:
      - claude/beautiful-fermat-l5mac7
    paths:
      - 'tools/finance-recovery/MODE'

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run recovery
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GLAMB_OS }}
          TURNO_CLIENTE: rainiela
          TICKET_ID: ticketms6eecwtsrfbs
          TICKET_MOTIVO: Inasistencia revertida — la seña se aplica al turno del 01/08
          CLIENTE_NOMBRE: Silvia Ayala
          COLABORADORA_NOMBRE: Leila
          HORA_ACTUAL: '06:30'
          HORA_NUEVA: '18:30'
          MOVER_FECHA: '2026-09-12'
          DIAS_ATRAS: '7'
          SENA_PAGO_ID: depmst4rez95azlj
        run: |
          cd tools/finance-recovery
          export MODE=$(cat MODE | tr -d ' \n')
          echo "MODE=$MODE"
          npm init -y >/dev/null 2>&1
          npm install @google-cloud/firestore@7 --no-audit --no-fund 2>&1 | tail -1
          node recover.js
